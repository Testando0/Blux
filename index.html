<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blux</title>
<style>
:root{--bg:#0d0d0f;--panel:#16161a;--panel2:#1e1e24;--border:#2a2a32;--text:#e8e6e3;--muted:#8a8894;--rose:#e84393;--rose2:#fd79a8;--grad:linear-gradient(135deg,#e84393,#fd79a8)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--rose)}

/* ===== TELAS ===== */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;flex-direction:column;gap:20px;padding:20px}
.screen h1{font-size:2rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.screen p{color:var(--muted);text-align:center;max-width:300px}
.gender-cards{display:flex;gap:16px;margin-top:10px}
.gcard{width:140px;padding:24px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:12px;transition:.2s}
.gcard:hover{border-color:var(--rose);transform:translateY(-2px)}
.gcard .gicon{font-size:2.5rem}
.gcard .gname{font-weight:600}

/* ===== APP ===== */
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;width:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
header .logo{font-size:1.3rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dchip{font-size:.75rem;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.dchip.prem{background:var(--grad);color:#fff;border:none}
.dchip.warn{border-color:var(--rose);color:var(--rose)}

/* ===== MENSAGENS ===== */
#wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--muted);gap:8px}
#empty .eicon{font-size:3rem}
.msg{display:flex;gap:10px;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0}
.msg .avatar img{width:100%;height:100%;object-fit:cover}
.msg .bub{padding:10px 14px;border-radius:16px;background:var(--panel);line-height:1.5;font-size:.95rem;word-break:break-word}
.msg.user .bub{background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bub{border-bottom-left-radius:4px}
.msg .bub img.chat-img{max-width:200px;border-radius:8px;margin-top:6px;display:block}
.a-actions{display:flex;gap:6px;margin-top:6px}
.a-actions button{font-size:.7rem;color:var(--muted);padding:2px 8px;border-radius:6px;transition:.15s}
.a-actions button:hover{color:var(--rose2);background:var(--panel)}
.tdots{display:inline-flex;gap:5px;padding:6px 0}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:tb 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ===== INPUT ===== */
#inputBar{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg)}
#ta{resize:none;max-height:120px;min-height:42px;border-radius:20px;padding:10px 16px}
#send{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
#send:disabled{opacity:.4;cursor:not-allowed}
#send svg{width:20px;height:20px;fill:#fff}
#send.stop{background:#e74c3c}
#imgPrev{position:relative;display:none;margin:0 16px 8px}
#imgPrev img{height:60px;border-radius:8px}
#imgPrev button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e74c3c;color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center}

/* ===== PAGAMENTO ===== */
#payBk{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:.3s}
#payBk.on{opacity:1;pointer-events:auto}
#paySheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:600px;background:var(--panel);border-radius:20px 20px 0 0;padding:24px;z-index:201;transition:.3s}
#paySheet.on{transform:translateX(-50%) translateY(0)}
#paySheet h2{text-align:center;margin-bottom:8px}
#paySheet p{color:var(--muted);text-align:center;font-size:.9rem;margin-bottom:16px}
#paySheet .plans{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
#paySheet .plan{padding:14px;border-radius:12px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#paySheet .plan.sel{border-color:var(--rose)}
#payBtn{width:100%;padding:14px;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:1rem}
#payClose{position:absolute;top:12px;right:16px;font-size:1.2rem;color:var(--muted)}
#codeInput{margin-top:12px;display:flex;gap:8px}
#codeInput input{flex:1}
#codeInput button{padding:10px 16px;border-radius:10px;background:var(--grad);color:#fff;font-weight:600}

/* ===== HISTÓRICO ===== */
#histPanel{position:fixed;top:0;left:-280px;width:280px;height:100%;background:var(--panel);z-index:150;transition:.3s;display:flex;flex-direction:column;border-right:1px solid var(--border)}
#histPanel.open{left:0}
#histPanel header{padding:16px}
#histList{flex:1;overflow-y:auto;padding:8px}
.hitem{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hitem:hover,.hitem.active{background:var(--panel2);color:var(--text)}
#newChat{margin:12px;padding:10px;border-radius:10px;background:var(--grad);color:#fff;font-weight:600;text-align:center}
</style>
</head>
<body>

<!-- TELA DE GÊNERO -->
<div class="screen" id="genderPick">
  <h1>Blux</h1>
  <p>Escolha com quem você quer conversar</p>
  <div class="gender-cards">
    <button class="gcard" onclick="pickGender('F')">
      <span class="gicon">👩</span>
      <span class="gname">Bluxa</span>
    </button>
    <button class="gcard" onclick="pickGender('M')">
      <span class="gicon">👨</span>
      <span class="gname">Blux</span>
    </button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <button id="menuBtn" style="font-size:1.2rem">☰</button>
    <span class="logo">Blux</span>
    <span class="dchip" id="msgsChip">✉️ 15 msgs</span>
  </header>

  <div id="wrap">
    <div id="empty">
      <span class="eicon">💬</span>
      <span>Manda uma mensagem pra começar…</span>
    </div>
    <div id="msgs"></div>
  </div>

  <div id="imgPrev"><img id="imgPrevImg"><button onclick="removeImage()">✕</button></div>

  <div id="inputBar">
    <button id="imgBtn" style="font-size:1.2rem;flex-shrink:0">📷</button>
    <textarea id="ta" rows="1" placeholder="Diga algo no meu ouvido…"></textarea>
    <button id="send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- HISTÓRICO -->
<div id="histPanel">
  <header><b>Conversas</b></header>
  <div id="histList"></div>
  <button id="newChat">+ Nova conversa</button>
</div>

<!-- PAGAMENTO -->
<div id="payBk"></div>
<div id="paySheet">
  <button id="payClose">✕</button>
  <h2>💎 Blux Premium</h2>
  <p>Converse sem limites, sem anúncios e com prioridade.</p>
  <div class="plans">
    <div class="plan sel" data-plan="30"><span>30 dias</span><b>R$ 9,90</b></div>
    <div class="plan" data-plan="90"><span>90 dias</span><b>R$ 19,90</b></div>
  </div>
  <button id="payBtn">Assinar agora</button>
  <div id="codeInput">
    <input id="codeTxt" placeholder="Tem um código? Digite aqui">
    <button id="codeBtn">Ativar</button>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*" class="hidden">

<script>
const $=s=>document.querySelector(s);
const SVG={
  send:'<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};

const FRASES_ERRO={
  F:['Ai, deu um probleminha aqui... me manda de novo? 🥺','Ops, minha conexão falhou, tenta de novo amor','Hmm, algo travou aqui, manda outra vez?'],
  M:['Putz, deu ruim aqui... manda de novo, vai','Ops, falhou a conexão, tenta outra vez','Deu erro aqui, manda de novo porra']
};
const FRASES_INT={
  F:['Calma amor, to pensando aqui...','Um segundinho so...','To digitando, espera ai...'],
  M:['Calma ai, to pensando...','Um segundo porra...','Espera ai, to elaborando...']
};

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  del(k){localStorage.removeItem(k)}
};

function makeId(){return 'u_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

let userId=store.get('userId',null);
if(!userId||typeof userId!=='string'||userId.length<6){
  userId=makeId();
  store.set('userId',userId);
}

let gender=store.get('gender',null);
let chats=store.get('chats',{});
let curId=store.get('curId',null);
let S={streaming:false,abort:null};
let currentImage=null;

function genero(){return gender==='M'?'M':'F'}
function pegarFrase(lista){const arr=lista[genero()]||lista.F;return arr[Math.floor(Math.random()*arr.length)]}
function cur(){return chats[curId]||null}

function novoChat(){
  const id='c_'+Date.now().toString(36);
  chats[id]={id,messages:[],created:Date.now()};
  curId=id;
  store.set('chats',chats);
  store.set('curId',curId);
  renderAll();
}

function md(t){
  if(!t)return '';
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.*?)\*/g,'<i>$1</i>')
    .replace(/\n/g,'<br>');
}

function maybeScroll(){
  const w=$('#wrap');
  if(w.scrollHeight-w.scrollTop-w.clientHeight<150)w.scrollTop=w.scrollHeight;
}

function buildNode(m,last){
  const d=document.createElement('div');
  d.className='msg '+m.role;
  const url=m.role==='user'?'':'https://api.dicebear.com/7.x/adventurer/svg?seed=Blux'+genero();
  let imgHtml='';
  if(m.image)imgHtml='<img class="chat-img" src="'+m.image+'">';
  const avatar=m.role==='user'?'':'<div class="avatar"><img src="'+url+'" alt="BLUX"></div>';
  const actions=(m.role==='assistant'&&!m.pending&&last)?'<div class="a-actions"><button onclick="copiar(this)">📋 copiar</button></div>':'';
  d.innerHTML=avatar+'<div class="bub"><div class="a-content">'+(m.pending?'<span class="tdots"><i></i><i></i><i></i></span>':md(m.content)+imgHtml)+'</div>'+actions+'</div>';
  return d;
}

function copiar(btn){
  const txt=btn.closest('.bub').querySelector('.a-content').innerText;
  navigator.clipboard?.writeText(txt);
  btn.textContent='✅ copiado';
  setTimeout(()=>btn.textContent='📋 copiar',1500);
}

function renderAll(){
  const c=cur(),box=$('#msgs');
  box.innerHTML='';
  const has=c&&c.messages.some(m=>m.content||m.image);
  $('#empty').classList.toggle('hidden',!!has);
  if(has){
    const msgs=c.messages.filter(m=>m.content||m.image);
    msgs.forEach((m,i)=>box.appendChild(buildNode(m,i===msgs.length-1&&m.role==='assistant')));
  }
  $('#wrap').scrollTop=$('#wrap').scrollHeight;
}

function renderHist(){
  const list=$('#histList');
  list.innerHTML='';
  const keys=Object.keys(chats).sort((a,b)=>chats[b].created-chats[a].created);
  keys.forEach(k=>{
    const c=chats[k];
    const first=c.messages.find(m=>m.role==='user');
    const label=first?(first.content||'📷 imagem').slice(0,30):'Nova conversa';
    const d=document.createElement('div');
    d.className='hitem'+(k===curId?' active':'');
    d.textContent=label;
    d.onclick=()=>{curId=k;store.set('curId',curId);renderAll();renderHist();$('#histPanel').classList.remove('open')};
    list.appendChild(d);
  });
}

function saveChats(){store.set('chats',chats);store.set('curId',curId)}

function uiStream(){
  document.body.classList.toggle('streaming',S.streaming);
  $('#send').innerHTML=S.streaming?SVG.stop:SVG.send;
  $('#send').classList.toggle('stop',S.streaming);
}

async function fetchStatus(){
  try{
    const r=await fetch('/api/status?userId='+encodeURIComponent(userId));
    const d=await r.json();
    const chip=$('#msgsChip');
    if(d.premium){
      chip.textContent='✨ Premium';
      chip.className='dchip prem';
      $('#send').disabled=false;
      $('#ta').disabled=false;
      $('#ta').placeholder='Diga algo no meu ouvido…';
    } else {
      chip.textContent='✉️ '+d.free+' msgs';
      chip.className='dchip'+(d.free<=3?' warn':'');
      if(d.free<=0){
        $('#send').disabled=true;
        $('#ta').disabled=true;
        $('#ta').placeholder='Limite atingido. Assine o Premium.';
      } else {
        $('#send').disabled=false;
        $('#ta').disabled=false;
        $('#ta').placeholder='Diga algo no meu ouvido…';
      }
    }
    return d;
  }catch{return null}
}

async function stream(){
  const c=cur();
  if(!c)return;
  const ta=$('#ta');
  const t=ta.value.trim();
  const hasImage=!!currentImage;
  if((!t&&!hasImage)||S.streaming)return;

  ta.value='';
  autoGrow();

  const userMsg={role:'user',content:t,image:currentImage||null};
  c.messages.push(userMsg);
  currentImage=null;
  $('#imgPrev').style.display='none';

  const m={role:'assistant',content:'',pending:true};
  c.messages.push(m);
  saveChats();
  renderAll();

  S.streaming=true;
  S.abort=new AbortController();
  uiStream();

  const node=$('#msgs').lastElementChild;
  const el=node?node.querySelector('.a-content'):null;

  const clientTimeout=setTimeout(()=>{if(S.streaming)S.abort.abort()},45000);

  const aplicarFrase=(tipo='erro')=>{
    const frase=tipo==='int'?pegarFrase(FRASES_INT):pegarFrase(FRASES_ERRO);
    if(!m.content||m.pending)m.content=frase;
    else m.content+='\n\n*'+frase+'*';
    m.pending=false;
    if(el)el.innerHTML=md(m.content);
    maybeScroll();
  };

  const hist=c.messages.filter(x=>x.role==='user'||x.role==='assistant').map(x=>({role:x.role,content:x.content||'[imagem]'}));

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      signal:S.abort.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:hist,gender,userId:userId})
    });

    if(r.status===402){
      clearTimeout(clientTimeout);
      aplicarFrase('erro');
      m.pending=false;
      S.streaming=false;
      S.abort=null;
      uiStream();
      saveChats();
      renderHist();
      renderAll();
      $('#payBk').classList.add('on');
      $('#paySheet').classList.add('on');
      $('#send').disabled=true;
      $('#ta').disabled=true;
      $('#ta').placeholder='Limite atingido. Assine o Premium.';
      fetchStatus();
      return;
    }

    if(!r.ok){
      clearTimeout(clientTimeout);
      aplicarFrase('erro');
      m.pending=false;
      S.streaming=false;
      S.abort=null;
      uiStream();
      saveChats();
      renderHist();
      renderAll();
      fetchStatus();
      return;
    }

    const rd=r.body.getReader(),dec=new TextDecoder();
    let buf='',teveErroApi=false;
    for(;;){
      const{done,value}=await rd.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n'))>=0){
        const L=buf.slice(0,i).trim();
        buf=buf.slice(i+1);
        if(!L.startsWith('data:'))continue;
        const d=L.slice(5).trim();
        if(!d||d==='[DONE]')continue;
        let j;
        try{j=JSON.parse(d)}catch{continue}
        if(j.error){teveErroApi=true;continue}
        const tk=j.choices?.[0]?.delta?.content;
        if(tk){
          if(m.pending){m.pending=false;if(el)el.innerHTML=''}
          m.content+=tk;
          if(el)el.innerHTML=md(m.content);
          maybeScroll();
        }
      }
    }

    clearTimeout(clientTimeout);
    if(teveErroApi&&!m.content)aplicarFrase('erro');

  }catch(e){
    clearTimeout(clientTimeout);
    if(e.name==='AbortError')aplicarFrase('int');
    else aplicarFrase('erro');
  }

  m.pending=false;
  S.streaming=false;
  S.abort=null;
  uiStream();
  if(!m.content)c.messages.pop();
  saveChats();
  renderHist();
  renderAll();
  fetchStatus();
}

function autoGrow(){
  const ta=$('#ta');
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,120)+'px';
}

function pickGender(g){
  gender=g;
  store.set('gender',g);
  abrirApp();
}

function abrirApp(){
  $('#genderPick').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderAll();
  renderHist();
  uiStream();
  $('#ta').focus();
  fetchStatus();
}

function removeImage(){
  currentImage=null;
  $('#imgPrev').style.display='none';
}

function boot(){
  const g=gender;
  if(g){
    abrirApp();
  }else{
    $('#genderPick').classList.remove('hidden');
  }
  if(!curId||!chats[curId])novoChat();
  renderHist();
}

// ===== EVENTOS =====
$('#send').onclick=()=>{
  if(S.streaming){S.abort?.abort();return}
  stream();
};

$('#ta').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!S.streaming)stream()}
});

$('#ta').addEventListener('input',autoGrow);

$('#menuBtn').onclick=()=>$('#histPanel').classList.toggle('open');
$('#newChat').onclick=()=>{novoChat();$('#histPanel').classList.remove('open')};

$('#imgBtn').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    currentImage=ev.target.result;
    $('#imgPrevImg').src=currentImage;
    $('#imgPrev').style.display='block';
  };
  rd.readAsDataURL(f);
  e.target.value='';
};

$('#payClose').onclick=()=>{
  $('#payBk').classList.remove('on');
  $('#paySheet').classList.remove('on');
};
$('#payBk').onclick=()=>{
  $('#payBk').classList.remove('on');
  $('#paySheet').classList.remove('on');
};

document.querySelectorAll('.plan').forEach(p=>{
  p.onclick=()=>{
    document.querySelectorAll('.plan').forEach(x=>x.classList.remove('sel'));
    p.classList.add('sel');
  };
});

$('#payBtn').onclick=()=>{
  alert('Redirecionando para pagamento...');
};

$('#codeBtn').onclick=async()=>{
  const code=$('#codeTxt').value.trim();
  if(!code)return;
  try{
    const r=await fetch('/api/activate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId,code})
    });
    const d=await r.json();
    if(d.ok){
      alert('Premium ativado! 🎉');
      $('#payBk').classList.remove('on');
      $('#paySheet').classList.remove('on');
      $('#send').disabled=false;
      $('#ta').disabled=false;
      $('#ta').placeholder='Diga algo no meu ouvido…';
      fetchStatus();
    }else{
      alert(d.error||'Código inválido');
    }
  }catch{
    alert('Erro ao ativar código');
  }
};

boot();
</script>
</body>
                             </html>
